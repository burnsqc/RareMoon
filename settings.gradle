pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
        	url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

gradle.ext.modName = 'RareMoon'
gradle.ext.modID = 'raremoon'
gradle.ext.modVersion = '1.0.0'
gradle.ext.forgeVersion = '44.1.0'
gradle.ext.mappingVersion = '1.20.1'
gradle.ext.minecraftVersion = '1.19.3'
